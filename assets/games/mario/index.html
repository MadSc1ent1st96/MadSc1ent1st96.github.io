<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Infinite Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            touch-action: manipulation;
            user-select: none;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        h1 {
            margin: 0 0 15px 0;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            text-align: center;
            letter-spacing: 1px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        
        .game-wrapper {
            position: relative;
            width: 95vw;
            max-width: 800px;
            height: auto;
            aspect-ratio: 16/9;
            max-height: 70vh;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
            border: 3px solid #4a90e2;
            background: #1a1a2e;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #5c94fc 0%, #4a7bc8 50%, #3c5aa6 100%);
            display: block;
            border-radius: 17px;
        }
        
        #scoreDisplay {
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            margin: 15px 0 10px 0;
            text-align: center;
            color: #fff;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(74,144,226,0.4);
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        #startBtn, #restartBtn, #mobileJump {
            padding: clamp(14px, 3vw, 18px) clamp(25px, 4vw, 35px);
            font-size: clamp(1.1rem, 2.5vw, 1.3rem);
            cursor: pointer;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            color: white;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(74,144,226,0.4);
            position: relative;
            overflow: hidden;
        }
        
        #startBtn:hover, #restartBtn:hover, #mobileJump:hover {
            box-shadow: 0 12px 35px rgba(74,144,226,0.6);
            background: linear-gradient(135deg, #5ba0f2 0%, #468acd 100%);
        }
        
        #startBtn:active, #restartBtn:active, #mobileJump:active {
            transform: scale(0.95);
        }
        
        #startBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            box-shadow: 0 8px 25px rgba(255,107,107,0.4);
        }
        
        #startBtn:hover {
            box-shadow: 0 12px 35px rgba(255,107,107,0.6);
            background: linear-gradient(135deg, #ff7b7b 0%, #ff6a2a 100%);
        }
        
        #mobileJump {
            display: none;
        }
        
        @media (max-width: 768px) {
            #gameContainer {
                padding: 10px;
            }
            
            .game-wrapper {
                width: 98vw;
                max-height: 60vh;
            }
            
            #mobileJump {
                display: inline-block;
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 100;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>Infinite Runner</h1>
        
        <div class="game-wrapper">
            <canvas id="gameCanvas"></canvas>
            <button id="startBtn">🚀 Start Game</button>
        </div>
        
        <div id="scoreDisplay">Score: 0</div>
        
        <div class="controls">
            <button id="restartBtn" style="display: none;">🔄 Restart</button>
            <button id="mobileJump">🕹️ Jump</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const mobileJump = document.getElementById('mobileJump');
        const scoreDisplay = document.getElementById('scoreDisplay');

        // Game state
        let gameRunning = false;
        let score = 0;
        let gameSpeed = 3;
        let cameraX = 0;

        // Player
        let player = {
            x: 150,
            y: 300,
            width: 40,
            height: 50,
            vx: 0,
            vy: 0,
            onGround: false,
            jumpCount: 0,
            maxJumps: 2
        };

        // Physics
        const GRAVITY = 0.8;
        const JUMP_FORCE = -16;
        const GROUND_Y = 350;
        const PLAYER_SPEED = 2;

        // Game objects
        let obstacles = [];
        let powerups = [];
        let particles = [];

        // Responsive canvas
        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Jump mechanics
        function jump() {
            if (player.jumpCount < player.maxJumps && gameRunning) {
                player.vy = JUMP_FORCE;
                player.onGround = false;
                player.jumpCount++;
                
                // Create jump particles
                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: player.x + player.width/2,
                        y: player.y + player.height,
                        vx: (Math.random() - 0.5) * 4,
                        vy: Math.random() * 3,
                        life: 30,
                        color: '#4a90e2'
                    });
                }
            }
        }

        // Generate obstacles with better patterns
        function generateObstacles() {
            if (score % 200 === 0 && score > 0) {
                const patterns = [
                    // Single obstacle
                    [{ x: canvas.width + cameraX, y: GROUND_Y - 30, width: 30, height: 30 }],
                    // Two obstacles with gap
                    [
                        { x: canvas.width + cameraX, y: GROUND_Y - 30, width: 30, height: 30 },
                        { x: canvas.width + cameraX + 120, y: GROUND_Y - 30, width: 30, height: 30 }
                    ],
                    // Low obstacle
                    [{ x: canvas.width + cameraX, y: GROUND_Y - 20, width: 40, height: 20 }],
                    // High obstacle
                    [{ x: canvas.width + cameraX, y: GROUND_Y - 50, width: 25, height: 50 }]
                ];
                
                const pattern = patterns[Math.floor(score / 200) % patterns.length];
                obstacles.push(...pattern);
            }
        }

        // Generate powerups
        function generatePowerups() {
            if (score % 400 === 0 && score > 0) {
                powerups.push({
                    x: canvas.width + cameraX,
                    y: GROUND_Y - 40,
                    width: 25,
                    height: 25,
                    type: 'energy'
                });
            }
        }

        // Update game objects
        function updateGameObjects() {
            // Update obstacles
            obstacles = obstacles.filter(obstacle => {
                obstacle.x -= gameSpeed;
                return obstacle.x > cameraX - 50;
            });

            // Update powerups
            powerups = powerups.filter(powerup => {
                powerup.x -= gameSpeed;
                return powerup.x > cameraX - 50;
            });

            // Update particles
            particles = particles.filter(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vy += 0.3;
                particle.life--;
                return particle.life > 0;
            });
        }

        // Collision detection
        function checkCollisions() {
            // Obstacle collisions
            obstacles.forEach(obstacle => {
                if (player.x < obstacle.x + obstacle.width &&
                    player.x + player.width > obstacle.x &&
                    player.y < obstacle.y + obstacle.height &&
                    player.y + player.height > obstacle.y) {
                    gameOver();
                }
            });

            // Powerup collisions
            powerups.forEach((powerup, index) => {
                if (player.x < powerup.x + powerup.width &&
                    player.x + player.width > powerup.x &&
                    player.y < powerup.y + powerup.height &&
                    player.y + player.height > powerup.y) {
                    score += 100;
                    powerups.splice(index, 1);
                    
                    // Create collection particles
                    for (let i = 0; i < 8; i++) {
                        particles.push({
                            x: powerup.x + powerup.width/2,
                            y: powerup.y + powerup.height/2,
                            vx: (Math.random() - 0.5) * 6,
                            vy: (Math.random() - 0.5) * 6,
                            life: 40,
                            color: '#2ecc71'
                        });
                    }
                }
            });
        }

        // Render functions
        function drawPlayer() {
            ctx.fillStyle = '#4a90e2';
            ctx.fillRect(player.x - cameraX, player.y, player.width, player.height);
            
            // Player glow effect
            ctx.shadowColor = '#4a90e2';
            ctx.shadowBlur = 10;
            ctx.fillRect(player.x - cameraX, player.y, player.width, player.height);
            ctx.shadowBlur = 0;
        }

        function drawObstacles() {
            obstacles.forEach(obstacle => {
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(obstacle.x - cameraX, obstacle.y, obstacle.width, obstacle.height);
            });
        }

        function drawPowerups() {
            powerups.forEach(powerup => {
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(powerup.x - cameraX, powerup.y, powerup.width, powerup.height);
                
                // Powerup glow
                ctx.shadowColor = '#2ecc71';
                ctx.shadowBlur = 8;
                ctx.fillRect(powerup.x - cameraX, powerup.y, powerup.width, powerup.height);
                ctx.shadowBlur = 0;
            });
        }

        function drawParticles() {
            particles.forEach(particle => {
                ctx.fillStyle = particle.color;
                ctx.globalAlpha = particle.life / 40;
                ctx.fillRect(particle.x - cameraX, particle.y, 3, 3);
            });
            ctx.globalAlpha = 1;
        }

        function drawGround() {
            ctx.fillStyle = '#34495e';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        }

        // Game loop
        function gameLoop() {
            if (!gameRunning) return;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update player physics
            player.vy += GRAVITY;
            player.y += player.vy;

            // Ground collision
            if (player.y + player.height > GROUND_Y) {
                player.y = GROUND_Y - player.height;
                player.vy = 0;
                player.onGround = true;
                player.jumpCount = 0;
            } else {
                player.onGround = false;
            }

            // Update camera to follow player
            cameraX = player.x - 150;

            // Update game objects
            updateGameObjects();
            generateObstacles();
            generatePowerups();
            checkCollisions();

            // Render everything
            drawGround();
            drawObstacles();
            drawPowerups();
            drawParticles();
            drawPlayer();

            // Update score and speed
            score++;
            if (score % 1000 === 0) {
                gameSpeed += 0.5;
            }
            
            scoreDisplay.textContent = `Score: ${score}`;

            requestAnimationFrame(gameLoop);
        }

        // Game control functions
        function startGame() {
            gameRunning = true;
            startBtn.style.display = 'none';
            restartBtn.style.display = 'inline-block';
            gameLoop();
        }

        function gameOver() {
            gameRunning = false;
            alert(`Game Over! Final Score: ${score}`);
            restartBtn.style.display = 'inline-block';
        }

        function restartGame() {
            // Reset game state
            score = 0;
            gameSpeed = 3;
            cameraX = 0;
            obstacles = [];
            powerups = [];
            particles = [];
            
            // Reset player
            player.x = 150;
            player.y = 300;
            player.vx = 0;
            player.vy = 0;
            player.onGround = false;
            player.jumpCount = 0;
            
            startGame();
        }

        // Event listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', restartGame);
        mobileJump.addEventListener('click', jump);

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                jump();
            }
        });

        // Touch controls
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameRunning) jump();
        });

        // Initialize
        resizeCanvas();
    </script>
</body>
</html>
