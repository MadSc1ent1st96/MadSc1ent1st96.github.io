<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Infinite Runner+</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        height: 100vh;
        background: linear-gradient(135deg, #181818 0%, #1c1c1d 100%);
        font-family: 'Segoe UI', Arial, sans-serif;
        color: white;
        touch-action: manipulation;
        user-select: none;
        overflow: hidden;
      }
      
      #gameContainer {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: linear-gradient(135deg, #181818 0%, #1c1c1d 100%);
      }
      
      h1 {
        margin: 0 0 12px 0;
        font-size: clamp(1.5rem, 4vw, 2.2rem);
        text-align: center;
        letter-spacing: 1px;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      }
      
      .game-wrapper {
        position: relative;
        width: 95vw;
        max-width: 800px;
        height: auto;
        aspect-ratio: 16/9;
        max-height: 65vh;
        margin: 0 auto;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(0,118,223,0.2), 0 6px 20px rgba(0,0,0,0.3);
        border: 3px solid #0076df;
        background: linear-gradient(135deg, #232323 0%, #1c1c1d 100%);
      }
      
      canvas {
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, #5c94fc 0%, #4a7bc8 50%, #3c5aa6 100%);
        display: block;
        border-radius: 17px;
      }
      
      #scoreDisplay {
        font-size: clamp(1.1rem, 3vw, 1.4rem);
        margin: 12px 0 8px 0;
        text-align: center;
        color: #fff;
        font-weight: 600;
        text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        background: linear-gradient(135deg, #0076df 0%, #0056b3 100%);
        padding: 8px 20px;
        border-radius: 25px;
        box-shadow: 0 4px 12px rgba(0,118,223,0.3);
      }
      
      .controls {
        display: flex;
        gap: 16px;
        margin-top: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      
      #startBtn, #restartBtn, #mobileJump {
        padding: clamp(12px, 3vw, 16px) clamp(20px, 4vw, 28px);
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        cursor: pointer;
        border: none;
        border-radius: 15px;
        background: linear-gradient(135deg, #0076df 0%, #0056b3 100%);
        color: white;
        transition: all 0.3s;
        font-weight: 600;
        box-shadow: 0 6px 16px rgba(0,118,223,0.3);
        min-height: 48px;
        min-width: 48px;
        position: relative;
        overflow: hidden;
      }
      
      #startBtn::before, #restartBtn::before, #mobileJump::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: left 0.5s;
      }
      
      #startBtn:hover::before, #restartBtn:hover::before, #mobileJump:hover::before {
        left: 100%;
      }
      
      #startBtn:hover, #restartBtn:hover, #mobileJump:hover {
        background: linear-gradient(135deg, #0088ff 0%, #0066cc 100%);
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0,118,223,0.4);
      }
      
      #startBtn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        font-size: 1.3rem;
        padding: 16px 32px;
      }
      
      #restartBtn {
        display: none;
      }
      
      #mobileJump {
        display: none;
        background: linear-gradient(135deg, #efcc00 0%, #d4b800 100%);
        color: #000;
        font-weight: 700;
        box-shadow: 0 6px 16px rgba(239,204,0,0.4);
        min-height: 60px;
        min-width: 160px;
        font-size: 1.1rem;
      }
      
      #mobileJump:hover {
        background: linear-gradient(135deg, #ffd700 0%, #e6c200 100%);
        box-shadow: 0 8px 20px rgba(239,204,0,0.5);
      }
      
      /* Mobile optimizations */
      @media (max-width: 768px) {
        #gameContainer {
          padding: 8px;
        }
        
        .game-wrapper {
          width: 100vw;
          max-height: 55vh;
          border-radius: 16px;
        }
        
        h1 {
          font-size: 1.3rem;
          margin-bottom: 8px;
        }
        
        #scoreDisplay {
          font-size: 1rem;
          margin: 8px 0 6px 0;
          padding: 6px 16px;
        }
        
        .controls {
          gap: 12px;
          margin-top: 8px;
        }
        
        #mobileJump {
          display: inline-block;
          position: fixed;
          bottom: 24px;
          left: 50%;
          transform: translateX(-50%);
          z-index: 100;
        }
      }
      
      @media (max-width: 480px) {
        .game-wrapper {
          max-height: 50vh;
        }
        
        h1 {
          font-size: 1.2rem;
        }
        
        #scoreDisplay {
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="gameContainer">
      <!-- No in-canvas/game title, only page-level title will be shown -->
      <div class="game-wrapper">
        <canvas id="gameCanvas" style="z-index:1; position:relative;"></canvas>
        <button id="startBtn" style="z-index:2; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">▶️ Start Game</button>
      </div>
      <p id="scoreDisplay">Score: 0</p>
      <div class="controls">
        <button id="restartBtn">🔁 Restart</button>
        <button id="mobileJump">🕹️ Tap to Jump</button>
        <span id="powerupTimer" style="display:none; color:#efcc00; font-weight:bold; font-size:1.2em; margin-left:1em;"></span>
      </div>
    </div>
    
    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const startBtn = document.getElementById("startBtn");
      const restartBtn = document.getElementById("restartBtn");
      const mobileJump = document.getElementById("mobileJump");
      
      // Mobile detection
      const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      
      // Responsive canvas setup
      function setupCanvas() {
        const wrapper = document.querySelector('.game-wrapper');
        const rect = wrapper.getBoundingClientRect();
        
        // Set canvas size to match wrapper
        canvas.width = rect.width;
        canvas.height = rect.height;
        
        // Store scale for collision detection
        window.gameScale = 1;
        
        // Lower resolution on mobile for better performance
        if (isMobile) {
          canvas.width = Math.min(canvas.width, 800);
          canvas.height = Math.min(canvas.height, 450);
        }
      }
      
      // Initialize canvas and handle resize
      setupCanvas();
      window.addEventListener('resize', () => {
        setTimeout(setupCanvas, 100);
      });
      
      // Preload assets
      const playerImg = new Image();
      playerImg.src = "img/player.png";
      const obstacleImg = new Image();
      obstacleImg.src = "img/obstacle.png";
      const powerupImg = new Image();
      powerupImg.src = "img/powerup.png";
      
      // Audio setup with mobile optimization
      const jumpSound = new Audio("sounds/jump.wav");
      const deathSound = new Audio("sounds/death.wav");
      const bgm = new Audio("sounds/bgm.mp3");
      bgm.loop = true;
      
      function preloadAudio() {
        jumpSound.load();
        deathSound.load();
        bgm.load();
        
        // Mobile audio optimization
        if (isMobile) {
          bgm.volume = 0.2;
          jumpSound.volume = 0.4;
          deathSound.volume = 0.4;
        }
      }
      
      // Game variables
      let player, gravity, score, speed, obstacles, powerups, gameOver, jumps;
      let invincible = false, invincibleTimer = 0, powerupCountdown = 0;
      let obstaclecooldown = 0;
      let lastFrameTime = 0;
      let frameCount = 0;
      let canDoubleJump = false;

      function initGame() {
          player = { 
            x: canvas.width * 0.12, 
            y: canvas.height * 0.75, 
            w: canvas.width * 0.06, 
            h: canvas.height * 0.15, 
            vy: 0, 
            jumpCount: 0 
          };
          gravity = canvas.height * 0.0035; // Lower gravity for floatier jump
          score = 0;
          speed = canvas.width * 0.002; // Slightly slower for playability
          obstacles = [];
          powerups = [];
          gameOver = false;
          jumps = 2;
          canDoubleJump = true;
          invincible = false;
          invincibleTimer = 0;
          powerupCountdown = 0;
          restartBtn.style.display = "none";
          document.getElementById("scoreDisplay").innerText = "Score: 0";
          document.getElementById("powerupTimer").style.display = "none";
          bgm.currentTime = 0;
          bgm.play().catch(e => {});
          update();
        }

      function jump() {
          if (!gameOver) {
            if (player.jumpCount === 0) {
              player.vy = -canvas.height * 0.15; // First jump (higher)
              player.jumpCount = 1;
              canDoubleJump = true;
              jumpSound.play().catch(e => {});
            } else if (player.jumpCount === 1 && canDoubleJump) {
              player.vy = -canvas.height * 0.13; // Double jump (slightly less)
              player.jumpCount = 2;
              canDoubleJump = false;
              jumpSound.play().catch(e => {});
            }
          }
        }

      // Keyboard and mouse/touch event handling
      document.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
          e.preventDefault();
          jump();
        }
      });
      canvas.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });
      canvas.addEventListener("mousedown", (e) => { e.preventDefault(); jump(); });
      canvas.addEventListener("click", (e) => { e.preventDefault(); jump(); });
      mobileJump.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });
      mobileJump.addEventListener("click", (e) => { e.preventDefault(); jump(); });

      startBtn.addEventListener("click", () => {
        startBtn.style.display = "none";
        if (isMobile) {
          mobileJump.style.display = "inline-block";
        }
        initGame();
      });
      
      restartBtn.onclick = () => {
        restartBtn.style.display = "none";
        initGame();
      };
      
      function drawPlayer() {
        ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);
      }
      
      function drawObstacle(ob) {
        ctx.drawImage(obstacleImg, ob.x, ob.y, ob.w, ob.h);
      }
      
      function drawPowerUp(pu) {
        ctx.drawImage(powerupImg, pu.x, pu.y, pu.w, pu.h);
      }
      
      function update(currentTime = 0) {
        if (gameOver) return;
         // Animation loop: always use requestAnimationFrame for smoothness
         lastFrameTime = currentTime;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
         // Draw blue gradient background
         const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
         bgGrad.addColorStop(0, '#5c94fc');
         bgGrad.addColorStop(0.5, '#4a7bc8');
         bgGrad.addColorStop(1, '#3c5aa6');
         ctx.fillStyle = bgGrad;
         ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Draw ground with gradient
        const groundGradient = ctx.createLinearGradient(0, canvas.height * 0.95, 0, canvas.height);
        groundGradient.addColorStop(0, "#3c763d");
        groundGradient.addColorStop(1, "#2d5a2d");
        ctx.fillStyle = groundGradient;
        ctx.fillRect(0, canvas.height * 0.95, canvas.width, canvas.height * 0.05);
        
        // Update player
        player.vy += gravity;
        player.y += player.vy;
        // Floor collision
        if (player.y >= canvas.height * 0.75) {
          player.y = canvas.height * 0.75;
          player.vy = 0;
          player.jumpCount = 0;
          canDoubleJump = true;
        }
        
        drawPlayer();
        
        // Generate obstacles
        if (obstaclecooldown <= 0 && Math.random() < 0.006) { // Slower obstacle generation
          obstacles.push({ 
            x: canvas.width, 
            y: canvas.height * 0.8, 
            w: canvas.width * 0.06, 
            h: canvas.height * 0.12 
          });
          obstaclecooldown = 150; // Longer cooldown
        } else {
          obstaclecooldown--;
        }
        
        // Update obstacles
        obstacles.forEach((ob) => {
          ob.x -= speed;
          drawObstacle(ob);
          if (!invincible && checkCollision(player, ob)) {
            endGame();
          }
        });
        obstacles = obstacles.filter((ob) => ob.x + ob.w > 0);
        
        // Generate powerups
        if (Math.random() < 0.002) { // Slower powerup generation
          powerups.push({ 
            x: canvas.width, 
            y: canvas.height * 0.7, 
            w: canvas.width * 0.05, 
            h: canvas.height * 0.1 
          });
        }
        
        // Update powerups
        powerups.forEach((pu) => {
          pu.x -= speed;
          drawPowerUp(pu);
          if (checkCollision(player, pu)) {
            score += 100;
            invincible = true;
            invincibleTimer = 300;
            pu.collected = true;
          }
        });
        powerups = powerups.filter((p) => !p.collected && p.x + p.w > 0);
        
        // Invincibility effect
        if (invincible) {
          invincibleTimer--;
          powerupCountdown = Math.ceil(invincibleTimer / 60);
          if (invincibleTimer <= 0) {
            invincible = false;
            document.getElementById("powerupTimer").style.display = "none";
          } else {
            document.getElementById("powerupTimer").style.display = "inline-block";
            document.getElementById("powerupTimer").textContent = `🛡️ Powerup: ${powerupCountdown}s`;
          }
          ctx.fillStyle = "#efcc00";
          ctx.font = `${canvas.width * 0.025}px Arial`;
          ctx.fillText("Invincible!", canvas.width * 0.7, canvas.height * 0.1);
        }
        
        score++;
        document.getElementById("scoreDisplay").innerText = "Score: " + score;
        
        requestAnimationFrame(update);
      }
      
      function checkCollision(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }
      
      function endGame() {
        gameOver = true;
        deathSound.play().catch(e => {});
        bgm.pause();
        
        setTimeout(() => {
          alert("💀 Game Over! Your score was: " + score);
          restartBtn.style.display = "inline-block";
        }, 500);
      }
      
      window.onload = () => {
        preloadAudio();
      };
    </script>
  </body>
</html>
