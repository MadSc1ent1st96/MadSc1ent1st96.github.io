<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Infinite Runner+</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #181818;
        font-family: 'Segoe UI', Arial, sans-serif;
        color: white;
        touch-action: manipulation;
        user-select: none;
      }
      #gameContainer {
        position: relative;
        width: 100vw;
        height: 100vh;
        max-width: 1100px;
        max-height: 800px;
        margin: 40px auto 0 auto;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        background: #111;
        border-radius: 24px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        padding-bottom: 32px;
      }
      h1 {
        margin: 16px 0 8px 0;
        font-size: 2.2em;
        text-align: center;
        letter-spacing: 1px;
      }
      canvas {
        max-width: 100%;
        max-height: 600px;
        background: #5c94fc;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        margin-bottom: 12px;
        display: block;
      }
      #scoreDisplay {
        font-size: 1.2em;
        margin: 8px 0 12px 0;
        text-align: center;
      }
      #startBtn,
      #restartBtn,
      #mobileJump {
        position: absolute;
        padding: 14px 28px;
        font-size: 1.1em;
        z-index: 2;
        cursor: pointer;
        border: none;
        border-radius: 10px;
        background-color: #ffffffcc;
        color: #000;
        transition: all 0.2s;
        min-height: 48px;
        min-width: 48px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      }
      #startBtn:hover,
      #restartBtn:hover,
      #mobileJump:hover {
        background-color: #fff;
        transform: scale(1.05);
      }
      #startBtn {
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      #restartBtn {
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
      }
      #mobileJump {
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        background-color: #ffcc00;
        color: #000;
        border-radius: 14px;
        box-shadow: 0 0 10px #ff0;
        min-height: 64px;
        min-width: 140px;
        font-size: 1.2em;
      }
      @media (max-width: 1200px) {
        #gameContainer {
          max-width: 98vw;
        }
      }
      @media (max-width: 900px) {
        #gameContainer {
          max-width: 100vw;
          padding-bottom: 16px;
        }
        canvas {
          max-height: 350px;
        }
      }
      @media (max-width: 600px) {
        #gameContainer {
          margin: 0;
          border-radius: 0;
        }
        h1 {
          font-size: 1.2em;
        }
        canvas {
          max-height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <div id="gameContainer">
      <h1>Infinite Runner+</h1>
      <canvas id="gameCanvas" width="900" height="400"></canvas>
      <p id="scoreDisplay">Score: 0</p>
      <button id="startBtn">▶️ Start Game</button>
      <button id="restartBtn">🔁 Restart Game</button>
      <button id="mobileJump">🕹️ Tap to Jump</button>
    </div>
    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const startBtn = document.getElementById("startBtn");
      const restartBtn = document.getElementById("restartBtn");
      const mobileJump = document.getElementById("mobileJump");
      function resizeCanvas() {
        const container = document.getElementById("gameContainer");
        const maxWidth = Math.min(900, container.offsetWidth - 40);
        const maxHeight = Math.min(400, window.innerHeight * 0.7);
        const scale = Math.min(maxWidth / 900, maxHeight / 400);
        canvas.style.width = (900 * scale) + "px";
        canvas.style.height = (400 * scale) + "px";
        window.gameScale = scale;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      const playerImg = new Image();
      playerImg.src = "img/player.png";
      const obstacleImg = new Image();
      obstacleImg.src = "img/obstacle.png";
      const powerupImg = new Image();
      powerupImg.src = "img/powerup.png";
      const jumpSound = new Audio("sounds/jump.wav");
      const deathSound = new Audio("sounds/death.wav");
      const bgm = new Audio("sounds/bgm.mp3");
      bgm.loop = true;
      function preloadAudio() {
        jumpSound.load();
        deathSound.load();
        bgm.load();
      }
      let player, gravity, score, speed, obstacles, powerups, gameOver, jumps;
      let invincible = false, invincibleTimer = 0;
      let obstaclecooldown = 0;
      let isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      function initGame() {
        player = { x: 50, y: 330, w: 40, h: 50, vy: 0, jumpCount: 0 };
        gravity = 0.6;
        score = 0;
        speed = 2;
        obstacles = [];
        powerups = [];
        gameOver = false;
        jumps = 2;
        invincible = false;
        invincibleTimer = 0;
        restartBtn.style.display = "none";
        document.getElementById("scoreDisplay").innerText = "Score: 0";
        if (isMobile) {
          bgm.volume = 0.3;
          jumpSound.volume = 0.5;
          deathSound.volume = 0.5;
        }
        bgm.currentTime = 0;
        bgm.play().catch(e => {});
        update();
      }
      function jump() {
        if (player.jumpCount < jumps && !gameOver) {
          player.vy = -18;
          player.jumpCount++;
          jumpSound.play().catch(e => {});
        }
      }
      document.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
          e.preventDefault();
          jump();
        }
      });
      // Touch/click anywhere on canvas to jump
      canvas.addEventListener("touchstart", (e) => {
        e.preventDefault();
        jump();
      });
      canvas.addEventListener("mousedown", (e) => {
        e.preventDefault();
        jump();
      });
      // Mobile jump button
      mobileJump.addEventListener("touchstart", (e) => {
        e.preventDefault();
        jump();
      });
      // Mouse click support for mobile
      canvas.addEventListener("click", (e) => {
        if (isMobile) {
          e.preventDefault();
          jump();
        }
      });
      startBtn.addEventListener("click", () => {
        startBtn.style.display = "none";
        if (isMobile) {
          mobileJump.style.display = "inline-block";
        }
        initGame();
      });
      restartBtn.onclick = () => {
        restartBtn.style.display = "none";
        initGame();
      };
      function drawPlayer() {
        ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);
      }
      function drawObstacle(ob) {
        ctx.drawImage(obstacleImg, ob.x, ob.y, ob.w, ob.h);
      }
      function drawPowerUp(pu) {
        ctx.drawImage(powerupImg, pu.x, pu.y, pu.w, pu.h);
      }
      function update() {
        if (gameOver) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#3c763d";
        ctx.fillRect(0, 380, canvas.width, 20);
        player.vy += gravity;
        player.y += player.vy;
        if (player.y >= 330) {
          player.y = 330;
          player.vy = 0;
          player.jumpCount = 0;
        }
        drawPlayer();
        if (obstaclecooldown <= 0 && Math.random() < 0.01) {
          obstacles.push({ x: canvas.width, y: 340, w: 40, h: 40 });
          obstaclecooldown = 120;
        } else {
          obstaclecooldown--;
        }
        obstacles.forEach((ob) => {
          ob.x -= speed;
          drawObstacle(ob);
          if (!invincible && checkCollision(player, ob)) {
            endGame();
          }
        });
        obstacles = obstacles.filter((ob) => ob.x + ob.w > 0);
        if (Math.random() < 0.0035) {
          powerups.push({ x: canvas.width, y: 310, w: 30, h: 30 });
        }
        powerups.forEach((pu) => {
          pu.x -= speed;
          drawPowerUp(pu);
          if (checkCollision(player, pu)) {
            score += 100;
            invincible = true;
            invincibleTimer = 300;
            pu.collected = true;
          }
        });
        powerups = powerups.filter((p) => !p.collected && p.x + p.w > 0);
        if (invincible) {
          invincibleTimer--;
          if (invincibleTimer <= 0) invincible = false;
          ctx.fillStyle = "yellow";
          ctx.fillText("Invincible!", 700, 30);
        }
        score++;
        document.getElementById("scoreDisplay").innerText = "Score: " + score;
        requestAnimationFrame(update);
      }
      function checkCollision(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }
      function endGame() {
        gameOver = true;
        deathSound.play().catch(e => {});
        bgm.pause();
        if (isMobile) {
          setTimeout(() => {
            alert("💀 Game Over! Your score was: " + score);
            restartBtn.style.display = "inline-block";
          }, 500);
        } else {
          alert("💀 Game Over! Your score was: " + score);
          restartBtn.style.display = "inline-block";
        }
      }
      window.onload = () => {
        preloadAudio();
      };
    </script>
  </body>
</html>
