<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Shooter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            touch-action: manipulation;
            user-select: none;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 {
            margin: 0 0 15px 0;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            text-align: center;
            letter-spacing: 1px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .game-wrapper {
            position: relative;
            width: 95vw;
            max-width: 800px;
            aspect-ratio: 16/9;
            max-height: 70vh;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
            border: 3px solid #00d4ff;
            background: #0a0a0a;
        }
        canvas {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #000011 0%, #001122 50%, #002244 100%);
            display: block;
            border-radius: 17px;
            pointer-events: none;
        }
        #scoreDisplay {
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            margin: 15px 0 10px 0;
            text-align: center;
            color: #fff;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(0,212,255,0.4);
        }
        .controls { display: flex; gap: 20px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
        #startBtn, #restartBtn, #mobileFire {
            padding: clamp(14px, 3vw, 18px) clamp(25px, 4vw, 35px);
            font-size: clamp(1.1rem, 2.5vw, 1.3rem);
            cursor: pointer;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,212,255,0.4);
            position: relative;
            overflow: hidden;
        }
        #startBtn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%); box-shadow: 0 8px 25px rgba(255,107,107,0.4); }
        #startBtn:hover { box-shadow: 0 12px 35px rgba(255,107,107,0.6); background: linear-gradient(135deg, #ff7b7b 0%, #ff6a2a 100%); }
        #restartBtn:hover, #mobileFire:hover { box-shadow: 0 12px 35px rgba(0,212,255,0.6); background: linear-gradient(135deg, #00e4ff 0%, #00aacc 100%); }
        #startBtn:active, #restartBtn:active, #mobileFire:active { transform: scale(0.95); }
        #mobileFire { display: none; }
        @media (max-width: 768px) {
            #gameContainer { padding: 10px; }
            .game-wrapper { width: 98vw; max-height: 60vh; }
            #mobileFire { display: inline-block; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 100; }
        }
    </style>
</head>
<body>
<div id="gameContainer">
    <h1>Space Shooter</h1>
    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <button id="startBtn">🚀 Start Game</button>
    </div>
    <div id="scoreDisplay">Score: 0</div>
    <div class="controls">
        <button id="restartBtn" style="display: none;">🔄 Restart</button>
        <button id="mobileFire">🔥 Fire</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const mobileFire = document.getElementById('mobileFire');
const scoreDisplay = document.getElementById('scoreDisplay');

// Game state
let gameRunning = false;
let score = 0;
let gameSpeed = 2;

// Player spaceship
let player = { x: 0, y: 0, width: 40, height: 30, speed: 5, health: 100 };

// Game objects
let bullets = [], enemies = [], asteroids = [], powerups = [], particles = [], stars = [];

// Responsive canvas
function resizeCanvas() {
    const wrapper = canvas.parentElement;
    canvas.width = wrapper.clientWidth;
    canvas.height = wrapper.clientHeight;
    player.x = canvas.width / 2 - player.width / 2;
    player.y = canvas.height - player.height - 20;
}
window.addEventListener('resize', () => { if(gameRunning) resizeCanvas(); });

// Initialize stars
function initStars() {
    stars = [];
    for (let i = 0; i < 100; i++) stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, speed: Math.random()*2+1, size: Math.random()*2+1 });
}

// Fire bullet
function fireBullet() {
    if(gameRunning) bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width:4, height:10, speed:8, color:'#00d4ff' });
}

// Generate enemies
function generateEnemies(){ if(Math.random()<0.02) enemies.push({ x: Math.random()*(canvas.width-30), y:-30, width:30, height:30, speed: Math.random()*2+1, health:1 }); }
// Generate asteroids
function generateAsteroids(){ if(Math.random()<0.01){ const size=Math.random()*20+10; asteroids.push({ x:Math.random()*(canvas.width-size), y:-size, width:size, height:size, speed:Math.random()*3+2, rotation:0, rotationSpeed:(Math.random()-0.5)*0.2 }); } }
// Generate powerups
function generatePowerups(){ if(Math.random()<0.005) powerups.push({ x:Math.random()*(canvas.width-20), y:-20, width:20, height:20, speed:2, type:'shield' }); }

// Update game objects
function updateGameObjects(){
    bullets = bullets.filter(b=>{ b.y-=b.speed; return b.y>-b.height; });
    enemies = enemies.filter(e=>{ e.y+=e.speed; return e.y<canvas.height+e.height; });
    asteroids = asteroids.filter(a=>{ a.y+=a.speed; a.rotation+=a.rotationSpeed; return a.y<canvas.height+a.height; });
    powerups = powerups.filter(p=>{ p.y+=p.speed; return p.y<canvas.height+p.height; });
    particles = particles.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.life--; return p.life>0; });
    stars.forEach(s=>{ s.y+=s.speed; if(s.y>canvas.height){ s.y=-5; s.x=Math.random()*canvas.width; } });
}

// Collision detection
function checkCollisions(){
    bullets.forEach((b,bi)=>{ enemies.forEach((e,ei)=>{ if(b.x<b.x+e.width && b.x+b.width>e.x && b.y<b.y+e.height && b.y+b.height>e.y){ bullets.splice(bi,1); enemies.splice(ei,1); score+=10; for(let i=0;i<8;i++) particles.push({x:e.x+e.width/2, y:e.y+e.height/2, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, life:30, color:'#ff6b6b'}); } }); });
    enemies.forEach((e,i)=>{ if(player.x<e.x+e.width && player.x+player.width>e.x && player.y<e.y+e.height && player.y+player.height>e.y){ enemies.splice(i,1); player.health-=20; for(let i=0;i<5;i++) particles.push({x:player.x+player.width/2, y:player.y+player.height/2, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, life:20, color:'#ff6b6b'}); } });
    asteroids.forEach((a,i)=>{ if(player.x<a.x+a.width && player.x+player.width>a.x && player.y<a.y+a.height && player.y+player.height>a.y){ asteroids.splice(i,1); player.health-=30; for(let i=0;i<10;i++) particles.push({x:a.x+a.width/2, y:a.y+a.height/2, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, life:40, color:'#8b4513'}); } });
    powerups.forEach((p,i)=>{ if(player.x<p.x+p.width && player.x+player.width>p.x && player.y<p.y+p.height && player.y+player.height>p.y){ powerups.splice(i,1); player.health=Math.min(100,player.health+30); score+=50; for(let i=0;i<6;i++) particles.push({x:p.x+p.width/2, y:p.y+p.height/2, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, life:25, color:'#00ff00'}); } });
}

// Draw functions
function drawStars(){ ctx.fillStyle='#ffffff'; stars.forEach(s=>ctx.fillRect(s.x,s.y,s.size,s.size)); }
function drawPlayer(){ ctx.fillStyle='#00d4ff'; ctx.fillRect(player.x,player.y,player.width,player.height); ctx.fillStyle='#ffffff'; ctx.fillRect(player.x+5,player.y+5,30,20); ctx.fillStyle='#00d4ff'; ctx.fillRect(player.x+10,player.y+10,20,10); ctx.fillStyle='#ff6b6b'; ctx.fillRect(player.x+15,player.y+player.height,10,5); }
function drawBullets(){ bullets.forEach(b=>{ ctx.fillStyle=b.color; ctx.fillRect(b.x,b.y,b.width,b.height); }); }
function drawEnemies(){ enemies.forEach(e=>{ ctx.fillStyle='#ff6b6b'; ctx.fillRect(e.x,e.y,e.width,e.height); ctx.fillStyle='#ffffff'; ctx.fillRect(e.x+5,e.y+5,20,20); ctx.fillStyle='#ff6b6b'; ctx.fillRect(e.x+8,e.y+8,14,14); }); }
function drawAsteroids(){ asteroids.forEach(a=>{ ctx.save(); ctx.translate(a.x+a.width/2,a.y+a.height/2); ctx.rotate(a.rotation); ctx.fillStyle='#8b4513'; ctx.fillRect(-a.width/2,-a.height/2,a.width,a.height); ctx.restore(); }); }
function drawPowerups(){ powerups.forEach(p=>{ ctx.fillStyle='#00ff00'; ctx.fillRect(p.x,p.y,p.width,p.height); ctx.shadowColor='#00ff00'; ctx.shadowBlur=10; ctx.fillRect(p.x,p.y,p.width,p.height); ctx.shadowBlur=0; }); }
function drawParticles(){ particles.forEach(p=>{ ctx.fillStyle=p.color; ctx.globalAlpha=p.life/40; ctx.fillRect(p.x,p.y,3,3); }); ctx.globalAlpha=1; }
function drawHealthBar(){ const barWidth=200, barHeight=15, barX=20, barY=20; ctx.fillStyle='#333'; ctx.fillRect(barX,barY,barWidth,barHeight); ctx.fillStyle=player.health>30?'#00ff00':'#ff6b6b'; ctx.fillRect(barX,barY,(player.health/100)*barWidth,barHeight); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(barX,barY,barWidth,barHeight); }

// Game loop
function gameLoop(){
    if(!gameRunning) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    updateGameObjects();
    generateEnemies();
    generateAsteroids();
    generatePowerups();
    checkCollisions();
    drawStars(); drawBullets(); drawEnemies(); drawAsteroids(); drawPowerups(); drawParticles(); drawPlayer(); drawHealthBar();
    score++; scoreDisplay.textContent=`Score: ${score}`;
    if(player.health<=0) gameOver();
    requestAnimationFrame(gameLoop);
}

// Game control functions
function startGame(){
    resizeCanvas();
    initStars();
    gameRunning=true;
    startBtn.style.display='none';
    restartBtn.style.display='inline-block';
    gameLoop();
}
function gameOver(){ gameRunning=false; alert(`Game Over! Final Score: ${score}`); restartBtn.style.display='inline-block'; }
function restartGame(){ score=0; gameSpeed=2; player.health=100; bullets=[]; enemies=[]; asteroids=[]; powerups=[]; particles=[]; startGame(); }

// Event listeners
startBtn.addEventListener('click',startGame);
restartBtn.addEventListener('click',restartGame);
mobileFire.addEventListener('click',fireBullet);
document.addEventListener('keydown',e=>{ if(!gameRunning) return; if(e.code==='Space'){ e.preventDefault(); fireBullet(); } });
canvas.addEventListener('mousemove',e=>{ if(!gameRunning) return; const rect=canvas.getBoundingClientRect(); const x=e.clientX-rect.left; player.x=Math.max(0,Math.min(canvas.width-player.width,x-player.width/2)); });
canvas.addEventListener('click',()=>{ if(gameRunning) fireBullet(); });
canvas.addEventListener('touchmove',e=>{ e.preventDefault(); if(!gameRunning) return; const rect=canvas.getBoundingClientRect(); const touch=e.touches[0]; const x=touch.clientX-rect.left; player.x=Math.max(0,Math.min(canvas.width-player.width,x-player.width/2)); });
canvas.addEventListener('touchstart',e=>{ e.preventDefault(); if(gameRunning) fireBullet(); });

// Initial canvas sizing
resizeCanvas();
</script>
</body>
</html>
