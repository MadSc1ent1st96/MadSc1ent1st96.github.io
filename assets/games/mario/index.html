<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            touch-action: manipulation;
            user-select: none;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        h1 {
            margin: 0 0 15px 0;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            text-align: center;
            letter-spacing: 1px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        
        .game-wrapper {
            position: relative;
            width: 95vw;
            max-width: 800px;
            height: auto;
            aspect-ratio: 16/9;
            max-height: 70vh;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
            border: 3px solid #00d4ff;
            background: #0a0a0a;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #000011 0%, #001122 50%, #002244 100%);
            display: block;
            border-radius: 17px;
        }
        
        #scoreDisplay {
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            margin: 15px 0 10px 0;
            text-align: center;
            color: #fff;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(0,212,255,0.4);
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        #startBtn, #restartBtn, #mobileFire {
            padding: clamp(14px, 3vw, 18px) clamp(25px, 4vw, 35px);
            font-size: clamp(1.1rem, 2.5vw, 1.3rem);
            cursor: pointer;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,212,255,0.4);
            position: relative;
            overflow: hidden;
        }
        
        #startBtn:hover, #restartBtn:hover, #mobileFire:hover {
            box-shadow: 0 12px 35px rgba(0,212,255,0.6);
            background: linear-gradient(135deg, #00e4ff 0%, #00aacc 100%);
        }
        
        #startBtn:active, #restartBtn:active, #mobileFire:active {
            transform: scale(0.95);
        }
        
        #startBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            box-shadow: 0 8px 25px rgba(255,107,107,0.4);
        }
        
        #startBtn:hover {
            box-shadow: 0 12px 35px rgba(255,107,107,0.6);
            background: linear-gradient(135deg, #ff7b7b 0%, #ff6a2a 100%);
        }
        
        #mobileFire {
            display: none;
        }
        
        @media (max-width: 768px) {
            #gameContainer {
                padding: 10px;
            }
            
            .game-wrapper {
                width: 98vw;
                max-height: 60vh;
            }
            
            #mobileFire {
                display: inline-block;
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 100;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>Space Shooter</h1>
        
        <div class="game-wrapper">
            <canvas id="gameCanvas"></canvas>
            <button id="startBtn">🚀 Start Game</button>
        </div>
        
        <div id="scoreDisplay">Score: 0</div>
        
        <div class="controls">
            <button id="restartBtn" style="display: none;">🔄 Restart</button>
            <button id="mobileFire">🔥 Fire</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const mobileFire = document.getElementById('mobileFire');
        const scoreDisplay = document.getElementById('scoreDisplay');

        // Game state
        let gameRunning = false;
        let score = 0;
        let gameSpeed = 2;

        // Player spaceship
        let player = {
            x: 0,
            y: 0,
            width: 40,
            height: 30,
            speed: 5,
            health: 100
        };

        // Game objects
        let bullets = [];
        let enemies = [];
        let asteroids = [];
        let powerups = [];
        let particles = [];
        let stars = [];

        // Responsive canvas
        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            
            // Center player
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - player.height - 20;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Initialize stars
        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 2 + 1,
                    size: Math.random() * 2 + 1
                });
            }
        }

        // Fire bullet
        function fireBullet() {
            if (gameRunning) {
                bullets.push({
                    x: player.x + player.width / 2 - 2,
                    y: player.y,
                    width: 4,
                    height: 10,
                    speed: 8,
                    color: '#00d4ff'
                });
            }
        }

        // Generate enemies
        function generateEnemies() {
            if (Math.random() < 0.02) {
                enemies.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    width: 30,
                    height: 30,
                    speed: Math.random() * 2 + 1,
                    health: 1
                });
            }
        }

        // Generate asteroids
        function generateAsteroids() {
            if (Math.random() < 0.01) {
                const size = Math.random() * 20 + 10;
                asteroids.push({
                    x: Math.random() * (canvas.width - size),
                    y: -size,
                    width: size,
                    height: size,
                    speed: Math.random() * 3 + 2,
                    rotation: 0,
                    rotationSpeed: (Math.random() - 0.5) * 0.2
                });
            }
        }

        // Generate powerups
        function generatePowerups() {
            if (Math.random() < 0.005) {
                powerups.push({
                    x: Math.random() * (canvas.width - 20),
                    y: -20,
                    width: 20,
                    height: 20,
                    speed: 2,
                    type: 'shield'
                });
            }
        }

        // Update game objects
        function updateGameObjects() {
            // Update bullets
            bullets = bullets.filter(bullet => {
                bullet.y -= bullet.speed;
                return bullet.y > -bullet.height;
            });

            // Update enemies
            enemies = enemies.filter(enemy => {
                enemy.y += enemy.speed;
                return enemy.y < canvas.height + enemy.height;
            });

            // Update asteroids
            asteroids = asteroids.filter(asteroid => {
                asteroid.y += asteroid.speed;
                asteroid.rotation += asteroid.rotationSpeed;
                return asteroid.y < canvas.height + asteroid.height;
            });

            // Update powerups
            powerups = powerups.filter(powerup => {
                powerup.y += powerup.speed;
                return powerup.y < canvas.height + powerup.height;
            });

            // Update particles
            particles = particles.filter(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life--;
                return particle.life > 0;
            });

            // Update stars
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = -5;
                    star.x = Math.random() * canvas.width;
                }
            });
        }

        // Collision detection
        function checkCollisions() {
            // Bullet vs Enemy
            bullets.forEach((bullet, bulletIndex) => {
                enemies.forEach((enemy, enemyIndex) => {
                    if (bullet.x < enemy.x + enemy.width &&
                        bullet.x + bullet.width > enemy.x &&
                        bullet.y < enemy.y + enemy.height &&
                        bullet.y + bullet.height > enemy.y) {
                        
                        // Remove bullet and enemy
                        bullets.splice(bulletIndex, 1);
                        enemies.splice(enemyIndex, 1);
                        score += 10;
                        
                        // Create explosion particles
                        for (let i = 0; i < 8; i++) {
                            particles.push({
                                x: enemy.x + enemy.width/2,
                                y: enemy.y + enemy.height/2,
                                vx: (Math.random() - 0.5) * 6,
                                vy: (Math.random() - 0.5) * 6,
                                life: 30,
                                color: '#ff6b6b'
                            });
                        }
                    }
                });
            });

            // Player vs Enemy
            enemies.forEach((enemy, index) => {
                if (player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y) {
                    
                    enemies.splice(index, 1);
                    player.health -= 20;
                    
                    // Create damage particles
                    for (let i = 0; i < 5; i++) {
                        particles.push({
                            x: player.x + player.width/2,
                            y: player.y + player.height/2,
                            vx: (Math.random() - 0.5) * 4,
                            vy: (Math.random() - 0.5) * 4,
                            life: 20,
                            color: '#ff6b6b'
                        });
                    }
                }
            });

            // Player vs Asteroid
            asteroids.forEach((asteroid, index) => {
                if (player.x < asteroid.x + asteroid.width &&
                    player.x + player.width > asteroid.x &&
                    player.y < asteroid.y + asteroid.height &&
                    player.y + player.height > asteroid.y) {
                    
                    asteroids.splice(index, 1);
                    player.health -= 30;
                    
                    // Create asteroid collision particles
                    for (let i = 0; i < 10; i++) {
                        particles.push({
                            x: asteroid.x + asteroid.width/2,
                            y: asteroid.y + asteroid.height/2,
                            vx: (Math.random() - 0.5) * 8,
                            vy: (Math.random() - 0.5) * 8,
                            life: 40,
                            color: '#8b4513'
                        });
                    }
                }
            });

            // Player vs Powerup
            powerups.forEach((powerup, index) => {
                if (player.x < powerup.x + powerup.width &&
                    player.x + player.width > powerup.x &&
                    player.y < powerup.y + powerup.height &&
                    player.y + player.height > powerup.y) {
                    
                    powerups.splice(index, 1);
                    player.health = Math.min(100, player.health + 30);
                    score += 50;
                    
                    // Create powerup collection particles
                    for (let i = 0; i < 6; i++) {
                        particles.push({
                            x: powerup.x + powerup.width/2,
                            y: powerup.y + powerup.height/2,
                            vx: (Math.random() - 0.5) * 4,
                            vy: (Math.random() - 0.5) * 4,
                            life: 25,
                            color: '#00ff00'
                        });
                    }
                }
            });
        }

        // Render functions
        function drawStars() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
        }

        function drawPlayer() {
            // Player spaceship
            ctx.fillStyle = '#00d4ff';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Spaceship details
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + 5, player.y + 5, 30, 20);
            ctx.fillStyle = '#00d4ff';
            ctx.fillRect(player.x + 10, player.y + 10, 20, 10);
            
            // Engine glow
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(player.x + 15, player.y + player.height, 10, 5);
        }

        function drawBullets() {
            bullets.forEach(bullet => {
                ctx.fillStyle = bullet.color;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });
        }

        function drawEnemies() {
            enemies.forEach(enemy => {
                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                
                // Enemy details
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(enemy.x + 5, enemy.y + 5, 20, 20);
                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(enemy.x + 8, enemy.y + 8, 14, 14);
            });
        }

        function drawAsteroids() {
            asteroids.forEach(asteroid => {
                ctx.save();
                ctx.translate(asteroid.x + asteroid.width/2, asteroid.y + asteroid.height/2);
                ctx.rotate(asteroid.rotation);
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(-asteroid.width/2, -asteroid.height/2, asteroid.width, asteroid.height);
                ctx.restore();
            });
        }

        function drawPowerups() {
            powerups.forEach(powerup => {
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(powerup.x, powerup.y, powerup.width, powerup.height);
                
                // Powerup glow
                ctx.shadowColor = '#00ff00';
                ctx.shadowBlur = 10;
                ctx.fillRect(powerup.x, powerup.y, powerup.width, powerup.height);
                ctx.shadowBlur = 0;
            });
        }

        function drawParticles() {
            particles.forEach(particle => {
                ctx.fillStyle = particle.color;
                ctx.globalAlpha = particle.life / 40;
                ctx.fillRect(particle.x, particle.y, 3, 3);
            });
            ctx.globalAlpha = 1;
        }

        function drawHealthBar() {
            const barWidth = 200;
            const barHeight = 15;
            const barX = 20;
            const barY = 20;
            
            ctx.fillStyle = '#333333';
            ctx.fillRect(barX, barY, barWidth, barHeight);
            
            ctx.fillStyle = player.health > 30 ? '#00ff00' : '#ff6b6b';
            ctx.fillRect(barX, barY, (player.health / 100) * barWidth, barHeight);
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(barX, barY, barWidth, barHeight);
        }

        // Game loop
        function gameLoop() {
            if (!gameRunning) return;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update game objects
            updateGameObjects();
            generateEnemies();
            generateAsteroids();
            generatePowerups();
            checkCollisions();

            // Render everything
            drawStars();
            drawBullets();
            drawEnemies();
            drawAsteroids();
            drawPowerups();
            drawParticles();
            drawPlayer();
            drawHealthBar();

            // Update score
            score++;
            scoreDisplay.textContent = `Score: ${score}`;

            // Check game over
            if (player.health <= 0) {
                gameOver();
            }

            requestAnimationFrame(gameLoop);
        }

        // Game control functions
        function startGame() {
            gameRunning = true;
            startBtn.style.display = 'none';
            restartBtn.style.display = 'inline-block';
            initStars();
            gameLoop();
        }

        function gameOver() {
            gameRunning = false;
            alert(`Game Over! Final Score: ${score}`);
            restartBtn.style.display = 'inline-block';
        }

        function restartGame() {
            // Reset game state
            score = 0;
            gameSpeed = 2;
            player.health = 100;
            bullets = [];
            enemies = [];
            asteroids = [];
            powerups = [];
            particles = [];
            
            startGame();
        }

        // Event listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', restartGame);
        mobileFire.addEventListener('click', fireBullet);

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            
            if (e.code === 'Space') {
                e.preventDefault();
                fireBullet();
            }
        });

        // Mouse/touch controls
        canvas.addEventListener('mousemove', (e) => {
            if (!gameRunning) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            player.x = Math.max(0, Math.min(canvas.width - player.width, x - player.width/2));
        });

        canvas.addEventListener('click', (e) => {
            if (gameRunning) fireBullet();
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            player.x = Math.max(0, Math.min(canvas.width - player.width, x - player.width/2));
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameRunning) fireBullet();
        });

        // Initialize
        resizeCanvas();
    </script>
</body>
</html>
